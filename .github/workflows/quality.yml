name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Python development dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Install Luacheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends lua5.1 liblua5.1-0-dev luarocks
          sudo luarocks --lua-version=5.1 install luacheck 1.2.0-1
      - name: Run repository and regression tests
        run: python Tests/run.py
      - name: Lint active first-party Lua
        run: python Tests/quality.py --lint
